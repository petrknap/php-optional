name: Java Test

on:
  pull_request:
    paths:
      - '**.java'

jobs:
  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto
      - run: javac tests/JavaSe8/OptionalTest.java
      - run: java -cp tests/JavaSe8 OptionalTest

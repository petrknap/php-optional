name: Java Test

on:
  pull_request:
    paths:
      - '**.java'

jobs:
  java-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - se: 8
            lts: 8
          - se: 9
            lts: 11
          - se: 10
            lts: 11
          - se: 11
            lts: 11
          - se: 16
            lts: 17
    name: Java SE ${{ matrix.se }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.lts }}
          distribution: corretto
      - run: javac tests/JavaSe${{ matrix.se }}/OptionalTest.java
      - run: java -ea -cp tests/JavaSe${{ matrix.se }} OptionalTest
